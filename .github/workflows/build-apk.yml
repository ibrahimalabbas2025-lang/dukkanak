
name: Build Dukkanak APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          unzip -o dokkanak-android-project-v2.zip -d android-src

      - name: Build APK
        working-directory: android-src/dokkanak-android-project/dokkanak_android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dokkanak-apk
          path: android-src/dokkanak-android-project/dokkanak_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
