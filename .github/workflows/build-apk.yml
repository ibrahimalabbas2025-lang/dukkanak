
name: Build Dukkanak APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p android-src
          unzip -o dokkanak-android-project-v2.zip -d android-src
          echo "Project files:"
          find android-src -maxdepth 4 -type f | head -200

      - name: Locate Gradle Wrapper
        run: |
          find android-src -type f -name gradlew -print
